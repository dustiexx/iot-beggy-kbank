; ESP32 sensor board -> AWS IoT Core (beggy/esp/env)
;
;   pio run -e aws -t upload     # normal: AWS IoT Core, port 8883, mutual TLS
;   pio run -e local -t upload   # temporary: Pi test broker pi6633101021.local:1883
;   pio run -e dht_test -t upload  # KY-015 (DHT11) test only, no Wi-Fi
;   pio run -e ldr_test -t upload  # KY-018 (LDR) + KY-015 test, no Wi-Fi
;   pio run -e dust_test -t upload # GP2Y1014AU0F (dust) test only, no Wi-Fi
;   pio device monitor           # serial log at 115200

[env]
platform = espressif32@6.9.0
; ESP32-S3 dev board, 16 MB flash; upload/monitor through the "COM" USB port (CH343)
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.0
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
build_flags =
    -DMQTT_MAX_PACKET_SIZE=1024
    ; Serial log on the native USB port (the one that shows up as COM3), not the CH343 "COM" port
    -DARDUINO_USB_CDC_ON_BOOT=1
; The certificates are compiled into the firmware straight from certs/,
; so they never need to be pasted into source code.
board_build.embed_txtfiles =
    certs/AmazonRootCA1.pem
    certs/device.pem.crt
    certs/private.pem.key

; the main firmware never includes the sensor test programs
build_src_filter = +<*> -<test_*.cpp>

[env:aws]

[env:local]
build_flags =
    ${env.build_flags}
    -DUSE_LOCAL_BROKER

; KY-015 (DHT11) only, prints to serial; needs no Wi-Fi, secrets or certs
[env:dht_test]
build_src_filter = +<test_dht.cpp>
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
board_build.embed_txtfiles =

; KY-018 (LDR) + KY-015 (DHT11), prints to serial; needs no Wi-Fi, secrets or certs
[env:ldr_test]
build_src_filter = +<test_ldr.cpp>
lib_deps = ${env:dht_test.lib_deps}
board_build.embed_txtfiles =

; GP2Y1014AU0F (dust) only, prints to serial; needs no Wi-Fi, secrets or certs
[env:dust_test]
build_src_filter = +<test_dust.cpp>
lib_deps =
board_build.embed_txtfiles =
